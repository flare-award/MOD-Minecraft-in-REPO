name: build

on:
  push:
    branches:
      - arena/01a10290-mod-minecraft-in-repo
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets the failure-diagnostics step push the ci-diagnostics branch

jobs:
  repo-mod-stubs:
    name: R.E.P.O. mod - offline stub references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build stub reference assembly
        run: dotnet build repo-mod/Stubs/StubAssemblies.csproj -c Release --nologo
      - name: Build MinecraftInRepo plugin
        run: dotnet build repo-mod/MinecraftInRepo.csproj -c Release --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftInRepo-stubs-build
          path: repo-mod/bin/Release/MinecraftInRepo.dll

  repo-mod-gamelibs:
    name: R.E.P.O. mod - real game assemblies (NuGet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build against R.E.P.O.GameLibs.Steam
        run: dotnet build repo-mod/MinecraftInRepo.csproj -c Release --nologo -p:UseGameLibsNuGet=true
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftInRepo-gamelibs-build
          path: repo-mod/bin/Release/MinecraftInRepo.dll

  mc-mod:
    name: Minecraft bridge mod - Fabric 1.21.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mc-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # current fabric-loom snapshots need JVM >= 25 to run;
                             # the mod itself still targets Java 21 (options.release)
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Resolve current fabric-loom / fabric-loader versions
        shell: bash
        run: |
          set -e
          loom=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            | grep -oE '<version>[^<]+-SNAPSHOT</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1 || true)
          loader=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml \
            | grep -oE '<version>[^<]+</version>' | sed 's/<[^>]*>//g' \
            | grep -vE 'beta|rc|pre' | sort -V | tail -1 || true)
          echo "Resolved: loom=${loom:-pinned} loader=${loader:-pinned}"
          [ -n "$loom" ] && echo "loom_version=$loom" >> gradle.properties
          [ -n "$loader" ] && echo "loader_version=$loader" >> gradle.properties
          tail -n 5 gradle.properties
      - name: Build with Loom
        shell: bash
        run: |
          if ./gradlew build --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "Gradle build failed - collecting full diagnostics"
            {
              echo "===== gradle build log (tail 800) ====="
              tail -n 800 /tmp/gradle-build.log
              echo
              echo "===== dependency insight: minecraft in compileClasspath ====="
              ./gradlew -q dependencyInsight --dependency minecraft --configuration compileClasspath 2>&1 | head -n 60 || true
              echo
              echo "===== deobf jar probe ====="
              jar=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name "*deobf*1.21.1.jar" 2>/dev/null | head -1)
              echo "jar: $jar"
              if [ -n "$jar" ]; then
                echo "class count: $(unzip -l "$jar" 2>/dev/null | grep -cE '\.class$')"
                echo "--- first 30 entries ---"
                unzip -l "$jar" 2>/dev/null | head -n 30
                echo "--- key classes ---"
                unzip -l "$jar" 2>/dev/null | grep -E 'net/minecraft/client/Minecraft\.class|client/renderer/GameRenderer\.class|world/entity/PrimedTnt\.class|server/level/ServerLevel\.class' | head -n 10
              fi
              echo
              echo "===== compileClasspath tree ====="
              ./gradlew -q dependencies --configuration compileClasspath 2>&1 | head -n 150 || true
              echo
              echo "===== gradle.properties ====="
              cat gradle.properties
            } > /tmp/diag.txt 2>&1
            root=$(grep -E 'FAILURE:|What went wrong|Caused by:|Could not resolve|Could not find|error:' /tmp/gradle-build.log | head -n 6 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::BUILD FAILED - see ci-diagnostics branch. Root cause lines:%0A${root}"
            mkdir -p ci-diag
            cp /tmp/diag.txt ci-diag/diag.txt
            git config user.name "ci-diagnostics"
            git config user.email "ci-diagnostics@users.noreply.github.com"
            git add ci-diag
            git commit -q -m "CI diagnostics for failed mc-mod build" || true
            git push -q -f origin HEAD:ci-diagnostics || echo "::warning::could not push diagnostics branch"
            echo "----- raw gradle log tail -----"
            tail -n 300 /tmp/gradle-build.log | sed 's/^/| /'
          else
            tail -n 60 /tmp/gradle-build.log | sed 's/^/| /'
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: mcrepo-fabric-mod
          path: |
            mc-mod/build/libs/*.jar
            !mc-mod/build/libs/*-sources.jar
