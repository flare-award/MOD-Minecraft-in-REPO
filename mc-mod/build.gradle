plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// NOTE: this mod intentionally has NO fabric-api dependency. Every hook is a
// plain Mixin, so the mod keeps working across Fabric API releases.
//
// In Loom 1.18+, `net.fabricmc.fabric-loom-remap` is the remapping plugin for
// obfuscated Minecraft versions (such as 1.21.1), paired with
// `loom.officialMojangMappings()`.

dependencies {
	// To change the version see gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
