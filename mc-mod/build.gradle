plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// NOTE: this mod intentionally has NO fabric-api dependency. Every hook is a
// plain Mixin, so the mod keeps working across Fabric API releases.
//
// Since loom 1.18 the default mappings are Mojang's official mappings and the
// loader dependency is injected by loom - the sources are written against
// official names (Minecraft, LocalPlayer, PrimedTnt, ServerLevel, ...).

dependencies {
	// To change the version see gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Provides the loader + Mixin classes on the compile classpath.
	// (The example template gets these transitively via fabric-api; this mod
	// intentionally skips fabric-api, so it declares the loader itself.)
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
