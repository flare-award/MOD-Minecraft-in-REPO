# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties
# The mod targets Minecraft 1.21.1. Sources use Mojang's official mappings
# (loom 1.18+ default). CI refreshes loom_version against maven.fabricmc.net;
# check https://fabricmc.net/develop when building locally.
minecraft_version=1.21.1
loom_version=1.18-SNAPSHOT
loader_version=0.16.9

# Mod properties
version=1.0.0
maven_group=com.flareaward.mcrepo
archives_base_name=mcrepo
